# curriculum.yaml — defines every lesson and exercise in the dbt-learn course.
#
# See curriculum.md for the full multi-stage design. Stage 0 is concept-only:
# 6 short lessons covering ELT, the modern data team, cloud warehouses, dbt
# itself, and the three flavors of dbt. Stage 1 walks the learner through
# scaffolding their first dbt project from scratch.
#
# Item IDs are descriptive (no numeric prefix) so reordering is just shuffling
# lines in this file — no rename of files or IDs required.

stages:
  - id: stage_0_foundations
    title: "Stage 0 — Foundations"
    items:
      - id: welcome
        type: lesson
        file: lessons/stage0/welcome.html

      - id: etl_vs_elt
        type: lesson
        file: lessons/stage0/etl_vs_elt.html
        quiz: quiz/etl_vs_elt.yaml

      - id: modern_data_team
        type: lesson
        file: lessons/stage0/modern_data_team.html
        quiz: quiz/modern_data_team.yaml

      - id: cloud_data_warehouses
        type: lesson
        file: lessons/stage0/cloud_data_warehouses.html
        quiz: quiz/cloud_data_warehouses.yaml

      - id: what_is_dbt
        type: lesson
        file: lessons/stage0/what_is_dbt.html
        quiz: quiz/what_is_dbt.yaml

      - id: dbt_flavors
        type: lesson
        file: lessons/stage0/dbt_flavors.html
        quiz: quiz/dbt_flavors.yaml

  - id: stage_1_first_project
    title: "Stage 1 — Your First dbt Project"
    items:
      - id: dbt_install
        type: exercise
        lesson:   lessons/stage1/dbt_install.html
        exercise: exercises/stage1/dbt_install.html
        original: originals/stage1/dbt_install.html
        hints:    hints/stage1/dbt_install.md
        verifier: dbt
        dbt_checks:
          rules:
            - type: dbt_installed

      - id: dbt_init
        type: exercise
        lesson:   lessons/stage1/dbt_init.html
        exercise: exercises/stage1/dbt_init.html
        original: originals/stage1/dbt_init.html
        hints:    hints/stage1/dbt_init.md
        verifier: file
        file_checks:
          - path: dbt_project/dbt_project.yml
            min_bytes: 100

      - id: profiles_yml
        type: exercise
        lesson:   lessons/stage1/profiles_yml.html
        exercise: exercises/stage1/profiles_yml.html
        original: originals/stage1/profiles_yml.html
        hints:    hints/stage1/profiles_yml.md
        verifier: dbt
        dbt_checks:
          rules:
            - type: dbt_debug_success

      - id: ingestion
        type: exercise
        lesson:   lessons/stage1/ingestion.html
        exercise: exercises/stage1/ingestion.html
        original: originals/stage1/ingestion.html
        hints:    hints/stage1/ingestion.md
        verifier: dbt
        dbt_checks:
          rules:
            - type: duckdb_table_exists
              table: raw_customers
            - type: duckdb_table_exists
              table: raw_orders
            - type: duckdb_table_exists
              table: raw_payments

      - id: first_model
        type: exercise
        lesson:   lessons/stage1/first_model.html
        exercise: exercises/stage1/first_model.html
        original: originals/stage1/first_model.html
        hints:    hints/stage1/first_model.md
        verifier: dbt
        dbt_checks:
          rules:
            - type: dbt_run_success
              select: stg__customers
            - type: duckdb_table_exists
              table: stg__customers

      - id: add_sources
        type: exercise
        lesson:   lessons/stage1/add_sources.html
        exercise: exercises/stage1/add_sources.html
        original: originals/stage1/add_sources.html
        hints:    hints/stage1/add_sources.md
        verifier: file
        file_checks:
          - path: dbt_project/models/staging/_sources.yml
            min_bytes: 80

      - id: project_yml
        type: exercise
        lesson:   lessons/stage1/project_yml.html
        exercise: exercises/stage1/project_yml.html
        original: originals/stage1/project_yml.html
        hints:    hints/stage1/project_yml.md
        verifier: dbt
        quiz:     quiz/stage1.yaml
        dbt_checks:
          rules:
            - type: dbt_run_success
              select: +dim_customers
            - type: manifest_materialization
              model: stg__customers
              expected: view
            - type: manifest_materialization
              model: dim_customers
              expected: table

  - id: stage_2_sources_and_structure
    title: "Stage 2 — Sources, Refs & Project Structure"
    items:
      - id: multi_source_split
        type: exercise
        lesson:   lessons/stage2/multi_source_split.html
        exercise: exercises/stage2/multi_source_split.html
        original: originals/stage2/multi_source_split.html
        hints:    hints/stage2/multi_source_split.md
        verifier: dbt
        dbt_checks:
          rules:
            - type: manifest_source_declared
              source: jaffle_shop
              tables: [raw_customers, raw_orders]
            - type: manifest_source_declared
              source: stripe
              tables: [raw_payments]
            - type: dbt_run_success
              select: stg__customers

      - id: more_staging
        type: exercise
        lesson:   lessons/stage2/more_staging.html
        exercise: exercises/stage2/more_staging.html
        original: originals/stage2/more_staging.html
        hints:    hints/stage2/more_staging.md
        verifier: dbt
        dbt_checks:
          rules:
            - type: dbt_run_success
              select: staging
            - type: duckdb_table_exists
              table: stg__orders
            - type: duckdb_table_exists
              table: stg__payments
            - type: duckdb_query
              name: stg__orders columns
              sql: "select order_id, customer_id, order_date, status from stg__orders limit 1"
              expected_rows: 1
            - type: duckdb_query
              name: stg__payments columns
              sql: "select payment_id, order_id, payment_method, amount from stg__payments limit 1"
              expected_rows: 1

      - id: intermediate_model
        type: exercise
        lesson:   lessons/stage2/intermediate_model.html
        exercise: exercises/stage2/intermediate_model.html
        original: originals/stage2/intermediate_model.html
        hints:    hints/stage2/intermediate_model.md
        verifier: dbt
        dbt_checks:
          rules:
            - type: dbt_run_success
              select: int_order_payments
            - type: duckdb_table_exists
              table: int_order_payments
            - type: duckdb_query
              name: int_order_payments row count
              sql: "select count(*) from int_order_payments"
              expected_value: 99
            - type: duckdb_query
              name: int_order_payments unique order_id
              sql: "select count(distinct order_id) from int_order_payments"
              expected_value: 99
            - type: duckdb_query
              name: int_order_payments columns
              sql: "select order_id, total_amount, payment_count from int_order_payments limit 1"
              expected_rows: 1

      - id: fact_model
        type: exercise
        lesson:   lessons/stage2/fact_model.html
        exercise: exercises/stage2/fact_model.html
        original: originals/stage2/fact_model.html
        hints:    hints/stage2/fact_model.md
        verifier: dbt
        dbt_checks:
          rules:
            - type: dbt_run_success
              select: +fct_orders
            - type: duckdb_table_exists
              table: fct_orders
            - type: duckdb_query
              name: fct_orders matches stg__orders count
              sql: "select case when (select count(*) from fct_orders) = (select count(*) from stg__orders) then 1 else 0 end"
              expected_value: 1
            - type: duckdb_query
              name: fct_orders columns
              sql: "select order_id, customer_id, first_name, last_name, order_date, status, amount, payment_count from fct_orders limit 1"
              expected_rows: 1

      - id: dbt_build
        type: exercise
        lesson:   lessons/stage2/dbt_build.html
        exercise: exercises/stage2/dbt_build.html
        original: originals/stage2/dbt_build.html
        hints:    hints/stage2/dbt_build.md
        verifier: dbt
        dbt_checks:
          rules:
            - type: dbt_build_success

      - id: dbt_docs
        type: exercise
        lesson:   lessons/stage2/dbt_docs.html
        exercise: exercises/stage2/dbt_docs.html
        original: originals/stage2/dbt_docs.html
        hints:    hints/stage2/dbt_docs.md
        verifier: dbt
        dbt_checks:
          rules:
            - type: dbt_docs_generated

      - id: naming_conventions
        type: lesson
        file: lessons/stage2/naming_conventions.html
        quiz: quiz/stage2.yaml

  - id: stage_3_data_quality
    title: "Stage 3 — Data Quality: Tests, Seeds & Analyses"
    items:
      - id: tests_intro
        type: lesson
        file: lessons/stage3/tests_intro.html

      - id: generic_tests
        type: exercise
        lesson:   lessons/stage3/generic_tests.html
        exercise: exercises/stage3/generic_tests.html
        original: originals/stage3/generic_tests.html
        hints:    hints/stage3/generic_tests.md
        verifier: dbt
        dbt_checks:
          rules:
            - type: dbt_test_success
              select: staging
            - type: manifest_test_count
              model: stg__customers
              min: 2
              tests: [unique, not_null]
            - type: manifest_test_count
              model: stg__orders
              min: 2
              tests: [unique, not_null]
            - type: manifest_test_count
              model: stg__payments
              min: 2
              tests: [unique, not_null]

      - id: accepted_values_relationships
        type: exercise
        lesson:   lessons/stage3/accepted_values_relationships.html
        exercise: exercises/stage3/accepted_values_relationships.html
        original: originals/stage3/accepted_values_relationships.html
        hints:    hints/stage3/accepted_values_relationships.md
        verifier: dbt
        dbt_checks:
          rules:
            - type: dbt_test_success
              select: fct_orders
            - type: manifest_test_count
              model: stg__orders
              min: 3
              tests: [accepted_values]
            - type: manifest_test_count
              model: fct_orders
              min: 3
              tests: [unique, not_null, relationships]

      - id: singular_test
        type: exercise
        lesson:   lessons/stage3/singular_test.html
        exercise: exercises/stage3/singular_test.html
        original: originals/stage3/singular_test.html
        hints:    hints/stage3/singular_test.md
        verifier: dbt
        dbt_checks:
          rules:
            - type: dbt_test_success
              select: "test_type:singular"

      - id: seed_basics
        type: exercise
        lesson:   lessons/stage3/seed_basics.html
        exercise: exercises/stage3/seed_basics.html
        original: originals/stage3/seed_basics.html
        hints:    hints/stage3/seed_basics.md
        verifier: dbt
        dbt_checks:
          rules:
            - type: dbt_seed_success
              select: order_status_descriptions
            - type: duckdb_table_exists
              table: order_status_descriptions
            - type: duckdb_query
              name: seed row count
              sql: "select count(*) from order_status_descriptions"
              expected_value: 5

      - id: analyses_intro
        type: exercise
        lesson:   lessons/stage3/analyses_intro.html
        exercise: exercises/stage3/analyses_intro.html
        original: originals/stage3/analyses_intro.html
        hints:    hints/stage3/analyses_intro.md
        verifier: dbt
        quiz:     quiz/stage3.yaml
        dbt_checks:
          rules:
            - type: dbt_compile_success
              select: top_customers_by_revenue
              compiled_artifact: analyses/top_customers_by_revenue.sql

  - id: stage_4_materializations_and_snapshots
    title: "Stage 4 — Materializations, Incremental & Snapshots"
    items:
      - id: materialization_overview
        type: lesson
        file: lessons/stage4/materialization_overview.html

      - id: view_to_table
        type: exercise
        lesson:   lessons/stage4/view_to_table.html
        exercise: exercises/stage4/view_to_table.html
        original: originals/stage4/view_to_table.html
        hints:    hints/stage4/view_to_table.md
        verifier: dbt
        dbt_checks:
          rules:
            - type: dbt_run_success
              select: int_order_payments
            - type: manifest_materialization
              model: int_order_payments
              expected: table
            - type: duckdb_query
              name: int_order_payments is a table not a view
              sql: "select table_type from information_schema.tables where table_name='int_order_payments'"
              expected_value: "BASE TABLE"

      - id: ephemeral_model
        type: exercise
        lesson:   lessons/stage4/ephemeral_model.html
        exercise: exercises/stage4/ephemeral_model.html
        original: originals/stage4/ephemeral_model.html
        hints:    hints/stage4/ephemeral_model.md
        verifier: dbt
        dbt_checks:
          rules:
            - type: dbt_run_success
              select: "+fct_orders"
            - type: manifest_materialization
              model: int_order_payments
              expected: ephemeral
            - type: duckdb_query
              name: fct_orders still has 99 rows after ephemeral inline
              sql: "select count(*) from fct_orders"
              expected_value: 99

      - id: incremental_basic
        type: exercise
        lesson:   lessons/stage4/incremental_basic.html
        exercise: exercises/stage4/incremental_basic.html
        original: originals/stage4/incremental_basic.html
        hints:    hints/stage4/incremental_basic.md
        verifier: dbt
        dbt_checks:
          rules:
            - type: dbt_build_success
              select: fct_order_events
            - type: manifest_materialization
              model: fct_order_events
              expected: incremental
            - type: duckdb_query
              name: fct_order_events row count
              sql: "select count(*) from fct_order_events"
              expected_value: 99

      - id: incremental_merge
        type: exercise
        lesson:   lessons/stage4/incremental_merge.html
        exercise: exercises/stage4/incremental_merge.html
        original: originals/stage4/incremental_merge.html
        hints:    hints/stage4/incremental_merge.md
        verifier: dbt
        dbt_checks:
          rules:
            - type: dbt_build_success
              select: fct_order_events
            - type: duckdb_query
              name: fct_order_events row count after merge config
              sql: "select count(*) from fct_order_events"
              expected_value: 99
            - type: duckdb_query
              name: fct_order_events still uniquely keyed
              sql: "select count(distinct order_id) from fct_order_events"
              expected_value: 99

      - id: snapshot_scd2
        type: exercise
        lesson:   lessons/stage4/snapshot_scd2.html
        exercise: exercises/stage4/snapshot_scd2.html
        original: originals/stage4/snapshot_scd2.html
        hints:    hints/stage4/snapshot_scd2.md
        verifier: dbt
        quiz:     quiz/stage4.yaml
        dbt_checks:
          rules:
            - type: dbt_snapshot_success
              select: orders_snapshot
            - type: duckdb_query
              name: snapshot active row count
              sql: "select count(*) from snapshots.orders_snapshot where dbt_valid_to is null"
              expected_value: 99
            - type: duckdb_query
              name: snapshot has SCD2 metadata columns
              sql: "select count(*) from information_schema.columns where table_name='orders_snapshot' and column_name in ('dbt_scd_id','dbt_updated_at','dbt_valid_from','dbt_valid_to')"
              expected_value: 4

  - id: stage_5_jinja_macros_state_exposures
    title: "Stage 5 — Jinja, Macros, State & Exposures"
    items:
      - id: jinja_basics
        type: lesson
        file: lessons/stage5/jinja_basics.html

      - id: first_macro
        type: exercise
        lesson:   lessons/stage5/first_macro.html
        exercise: exercises/stage5/first_macro.html
        original: originals/stage5/first_macro.html
        hints:    hints/stage5/first_macro.md
        verifier: dbt
        dbt_checks:
          rules:
            - type: dbt_run_success
              select: stg__payments
            - type: manifest_macro_exists
              name: cents_to_dollars
            - type: duckdb_query
              name: stg__payments still produces dollar values
              sql: "select count(*) from stg__payments where amount >= 0 and amount < 100"
              expected_value: 113

      - id: state_selection
        type: exercise
        lesson:   lessons/stage5/state_selection.html
        exercise: exercises/stage5/state_selection.html
        original: originals/stage5/state_selection.html
        hints:    hints/stage5/state_selection.md
        verifier: dbt
        dbt_checks:
          rules:
            - type: path_exists
              path: state_initial/manifest.json
            - type: file_contains
              path: dbt_project/models/marts/dim_customers.sql
              contains: "state-selection-marker"
            - type: dbt_run_success
              select: "state:modified+"
              state: "../state_initial"

      - id: exposures
        type: exercise
        lesson:   lessons/stage5/exposures.html
        exercise: exercises/stage5/exposures.html
        original: originals/stage5/exposures.html
        hints:    hints/stage5/exposures.md
        verifier: dbt
        dbt_checks:
          rules:
            - type: dbt_docs_generated
            - type: manifest_exposure_exists
              name: orders_dashboard
              depends_on: [fct_orders, dim_customers]

      - id: dbt_utils_install
        type: exercise
        lesson:   lessons/stage5/dbt_utils_install.html
        exercise: exercises/stage5/dbt_utils_install.html
        original: originals/stage5/dbt_utils_install.html
        hints:    hints/stage5/dbt_utils_install.md
        verifier: dbt
        quiz:     quiz/stage5.yaml
        dbt_checks:
          rules:
            - type: path_exists
              path: dbt_project/dbt_packages/dbt_utils
            - type: dbt_run_success
              select: fct_orders
            - type: duckdb_query
              name: fct_orders.order_key is unique
              sql: "select count(distinct order_key) from fct_orders"
              expected_value: 99

  - id: stage_6_advanced_testing_and_cli
    title: "Stage 6 — Advanced Testing & the dbt CLI Tour"
    items:
      - id: advanced_testing_overview
        type: lesson
        file: lessons/stage6/advanced_testing_overview.html

      - id: severity_warn
        type: exercise
        lesson:   lessons/stage6/severity_warn.html
        exercise: exercises/stage6/severity_warn.html
        original: originals/stage6/severity_warn.html
        hints:    hints/stage6/severity_warn.md
        verifier: dbt
        dbt_checks:
          rules:
            - type: dbt_test_success
              select: stg__orders
            - type: file_contains
              path: dbt_project/models/staging/_models.yml
              contains: "severity: warn"

      - id: custom_generic_test
        type: exercise
        lesson:   lessons/stage6/custom_generic_test.html
        exercise: exercises/stage6/custom_generic_test.html
        original: originals/stage6/custom_generic_test.html
        hints:    hints/stage6/custom_generic_test.md
        verifier: dbt
        dbt_checks:
          rules:
            - type: path_exists
              path: dbt_project/tests/generic/non_negative.sql
            - type: file_contains
              path: dbt_project/tests/generic/non_negative.sql
              contains: "{% test non_negative"
            - type: dbt_test_success
              select: int_order_payments

      - id: dbt_expectations_install
        type: exercise
        lesson:   lessons/stage6/dbt_expectations_install.html
        exercise: exercises/stage6/dbt_expectations_install.html
        original: originals/stage6/dbt_expectations_install.html
        hints:    hints/stage6/dbt_expectations_install.md
        verifier: dbt
        dbt_checks:
          rules:
            - type: path_exists
              path: dbt_project/dbt_packages/dbt_expectations
            - type: dbt_test_success
              select: fct_orders
            - type: manifest_test_count
              model: fct_orders
              min: 4

      - id: dbt_show_command
        type: exercise
        lesson:   lessons/stage6/dbt_show_command.html
        exercise: exercises/stage6/dbt_show_command.html
        original: originals/stage6/dbt_show_command.html
        hints:    hints/stage6/dbt_show_command.md
        verifier: dbt
        dbt_checks:
          rules:
            - type: dbt_show_success
              select: fct_orders
              limit: 5

      - id: commands_tour
        type: lesson
        file: lessons/stage6/commands_tour.html

      - id: target_directory_tour
        type: exercise
        lesson:   lessons/stage6/target_directory_tour.html
        exercise: exercises/stage6/target_directory_tour.html
        original: originals/stage6/target_directory_tour.html
        hints:    hints/stage6/target_directory_tour.md
        verifier: dbt
        quiz:     quiz/stage6.yaml
        dbt_checks:
          rules:
            - type: path_exists
              path: dbt_project/target/manifest.json
            - type: path_exists
              path: dbt_project/target/run_results.json
            - type: path_exists
              path: dbt_project/target/compiled
            - type: path_exists
              path: dbt_project/target/run

  - id: stage_7_production_and_tooling
    title: "Stage 7 — Production Patterns & Tooling"
    items:
      - id: deployment_patterns
        type: lesson
        file: lessons/stage7/deployment_patterns.html

      - id: multi_target_profile
        type: exercise
        lesson:   lessons/stage7/multi_target_profile.html
        exercise: exercises/stage7/multi_target_profile.html
        original: originals/stage7/multi_target_profile.html
        hints:    hints/stage7/multi_target_profile.md
        verifier: dbt
        dbt_checks:
          rules:
            - type: file_contains
              path: dbt_project/profiles.yml
              contains: "prod:"
            - type: path_exists
              path: database/prod.duckdb

      - id: analysis_to_model
        type: exercise
        lesson:   lessons/stage7/analysis_to_model.html
        exercise: exercises/stage7/analysis_to_model.html
        original: originals/stage7/analysis_to_model.html
        hints:    hints/stage7/analysis_to_model.md
        verifier: dbt
        dbt_checks:
          rules:
            - type: path_exists
              path: dbt_project/models/marts/mart_customer_revenue.sql
            - type: file_contains
              path: dbt_project/models/marts/mart_customer_revenue.sql
              contains: "final as ("
            - type: dbt_run_success
              select: mart_customer_revenue
            - type: manifest_test_count
              model: mart_customer_revenue
              min: 2
              tests: [unique, not_null]
            - type: file_contains
              path: dbt_project/models/marts/_models.yml
              contains: "meta:"
            - type: file_contains
              path: dbt_project/models/marts/_models.yml
              contains: "tags:"

      - id: tooling_landscape
        type: lesson
        file: lessons/stage7/tooling_landscape.html

      - id: course_complete
        type: lesson
        file: lessons/stage7/course_complete.html
        quiz: quiz/stage7.yaml
