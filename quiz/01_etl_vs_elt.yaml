topic: etl_vs_elt
questions:
  - id: etl_vs_elt_01
    difficulty: easy
    type: multiple_choice
    prompt: "In ELT, where does the Transform step happen?"
    options:
      a: "On a separate ETL server before the warehouse"
      b: "Inside the cloud data warehouse, after raw data is loaded"
      c: "On the source system, before extraction"
      d: "Inside dbt Cloud, on dbt Labs' infrastructure"
    answer: b
    explanation: |
      ELT means Extract, Load, then Transform — the transform runs in SQL inside
      the cloud warehouse where the raw data was loaded. dbt is the tool that
      defines and orchestrates that transform layer.
    related_item: 01_etl_vs_elt

  - id: etl_vs_elt_02
    difficulty: medium
    type: multiple_choice
    prompt: "Which factor most directly enabled the industry shift from ETL to ELT?"
    options:
      a: "Faster Python interpreters"
      b: "Cheap, elastic cloud-warehouse compute and effectively unlimited storage"
      c: "Better ETL GUIs"
      d: "Stricter PII regulations"
    answer: b
    explanation: |
      Cloud warehouses decoupled storage from compute and made both cheap and
      elastic. That made it economical to load raw data first and transform it
      inside the warehouse — the core ELT pattern.
    related_item: 01_etl_vs_elt
